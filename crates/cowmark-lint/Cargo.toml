[package]
name = "cowmark-lint"
version = "0.1.0"
edition = "2024"
description = "Checks CaterCow marketing content files (MDC components, front matter, images, links)."
publish = false

[dependencies]
indexmap = "2.14.2"
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1.13.1"
saphyr-parser = "0.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[features]
default = ["fs"]
# FileLookup on the local filesystem.
fs = []
