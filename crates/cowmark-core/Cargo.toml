[package]
name = "cowmark-core"
version = "0.1.0"
description = "CowMark's content-folder logic: sign-in, session, git and preview diffs, without Tauri"
license = "AGPL-3.0-only"
edition = "2021"
publish = false

[dependencies]
base64 = "0.22"
cowmark-lint = { path = "../cowmark-lint" }
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10.9"
similar = "3.2.1"
interprocess = "2.4.7"
csv = "1"

[target.'cfg(windows)'.dependencies]
widestring = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }
